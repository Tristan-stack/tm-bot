name: launch-bot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: launchbot
      POSTGRES_PASSWORD: launchbot
      POSTGRES_DB: launchbot
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on first start of an empty volume: creates launchbot_test.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchbot -d launchbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
